<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CMMGH — MCP URL</title>
<style>
  :root { color-scheme: dark light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e6e6;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box;
  }
  .card {
    background: #171a21; padding: 28px; border-radius: 14px;
    width: 100%; max-width: 460px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 18px; margin: 0 0 16px; color: #fff; }
  .row { display: flex; gap: 8px; }
  input[readonly] {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #2b2f3a;
    background: #0f1115; color: #fff; font-family: monospace; font-size: 13px;
  }
  button {
    padding: 10px 14px; border: none; border-radius: 8px; background: #2fae5a;
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: #2b2f3a; }
  .msg { margin-top: 14px; font-size: 13px; color: #a9adb8; }
  .msg.err { color: #ff6b6b; }
  .actions { margin-top: 18px; display: flex; gap: 10px; }
  .timer { margin-top: 10px; font-size: 12px; color: #58d68d; }
</style>
</head>
<body>
  <div class="card">
    <h1>MCP ulanish manzili</h1>
    <div class="row">
      <input id="tok" type="text" readonly value="Yuklanmoqda..." />
      <button id="copy">Nusxa</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="timer" id="timer"></div>
    <div class="actions">
      <button class="secondary" id="refresh">Yangilash</button>
      <button class="secondary" id="logout">Chiqish</button>
    </div>
  </div>
<script>
  const FLAG = "cmmgh_token_page_used";
  const AUTO_CLOSE_MS = 30 * 1000;

  // Sahifa qayta yuklansa (browser refresh) — token'ni qayta ko'rsatmay,
  // darhol login'ga qaytar (sessionStorage faqat shu tab uchun, yangi tab/login'da tozalanadi).
  if (sessionStorage.getItem(FLAG)) {
    fetch("/api/logout", { method: "POST" }).finally(() => {
      window.location.replace("/login/");
    });
  } else {
    sessionStorage.setItem(FLAG, "1");
    boot();
  }

  function boot() {
    const tok = document.getElementById("tok");
    const msg = document.getElementById("msg");
    const timerEl = document.getElementById("timer");
    let closeAt = Date.now() + AUTO_CLOSE_MS;
    let countdownInterval = null;

    function startCountdown() {
      clearInterval(countdownInterval);
      closeAt = Date.now() + AUTO_CLOSE_MS;
      countdownInterval = setInterval(() => {
        const left = Math.max(0, Math.round((closeAt - Date.now()) / 1000));
        timerEl.textContent = `Sahifa ${left} soniyadan keyin yopiladi.`;
        if (left <= 0) {
          clearInterval(countdownInterval);
          closeSession();
        }
      }, 250);
    }

    async function closeSession() {
      sessionStorage.removeItem(FLAG);
      await fetch("/api/logout", { method: "POST" }).catch(() => {});
      window.location.replace("/login/");
    }

    async function load() {
      msg.textContent = ""; msg.className = "msg";
      tok.value = "Yuklanmoqda...";
      try {
        const res = await fetch("/api/get-token", { credentials: "same-origin" });
        if (res.status === 401) {
          sessionStorage.removeItem(FLAG);
          window.location.replace("/login/");
          return;
        }
        const data = await res.json();
        if (res.ok && data.url) {
          tok.value = data.url;
          msg.textContent = "";
        } else {
          tok.value = "";
          msg.textContent = "URL olinmadi.";
          msg.className = "msg err";
        }
      } catch {
        tok.value = "";
        msg.textContent = "Server bilan bog'lanib bo'lmadi.";
        msg.className = "msg err";
      }
    }

    document.getElementById("copy").addEventListener("click", async () => {
      if (!tok.value) return;
      await navigator.clipboard.writeText(tok.value);
      msg.textContent = "Nusxalandi.";
      msg.className = "msg";
    });
    document.getElementById("refresh").addEventListener("click", () => {
      load();
      startCountdown();
    });
    document.getElementById("logout").addEventListener("click", closeSession);

    load();
    startCountdown();
  }
</script>
</body>
</html>

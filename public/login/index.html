<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CMMGH — Login</title>
<style>
  :root { color-scheme: dark light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e6e6;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0;
  }
  .card {
    background: #171a21; padding: 32px; border-radius: 14px;
    width: 100%; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 22px; margin: 0; color: #fff; }
  .subtitle { font-size: 12px; margin: 4px 0 20px; color: #7d8390; letter-spacing: .2px; }
  label { display: block; font-size: 13px; margin: 14px 0 6px; color: #a9adb8; }
  input:focus { border-color: #2fae5a; outline: none; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    border-radius: 8px; border: 1px solid #2b2f3a; background: #0f1115;
    color: #fff; font-size: 14px;
  }
  button {
    width: 100%; margin-top: 20px; padding: 11px; border: none;
    border-radius: 8px; background: #2fae5a; color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  .msg.err { color: #ff6b6b; }
  .msg.ok { color: #58d68d; }
</style>
</head>
<body>
  <div class="card">
    <h1>CMMGH</h1>
    <div class="subtitle">ConnectMyMcpGithub</div>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Parol</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button id="btn" type="submit">Kirish</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
<script>
  const f = document.getElementById("f");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = ""; msg.className = "msg";
    btn.disabled = true; btn.textContent = "Tekshirilmoqda...";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        sessionStorage.removeItem("cmmgh_token_page_used");
        window.location.href = "/token/";
        return;
      }
      if (res.status === 429) {
        msg.textContent = "Juda ko'p urinish, birozdan keyin qayta urin.";
      } else {
        msg.textContent = "Email yoki parol noto'g'ri.";
      }
      msg.className = "msg err";
    } catch {
      msg.textContent = "Server bilan bog'lanib bo'lmadi.";
      msg.className = "msg err";
    } finally {
      btn.disabled = false; btn.textContent = "Kirish";
    }
  });
</script>
</body>
</html>
